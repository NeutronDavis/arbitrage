[package]
name        = "arb-bot"
version     = "0.1.0"
edition     = "2021"
description = "Arbitrum WETH/USDC flash-loan arbitrage bot"
default-run = "arb-bot"

[lib]
name = "arb_bot"
path = "src/lib.rs"

[[bin]]
name = "arb-bot"
path = "src/main.rs"

[[bin]]
name = "summarize"
path = "src/bin/summarize.rs"

[[bin]]
name = "verify_parity"
path = "src/bin/verify_parity.rs"

[dependencies]
# Ethereum — alloy 2.4 (stable, successor to ethers-rs)
# https://docs.rs/alloy/latest/alloy/
alloy = { version = "2.5", features = [
    "provider-http",
    "provider-ws",
    "pubsub",
    "sol-types",
    "contract",
    "rpc-types",
    "network",
    "transports",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling — no unwrap() in production paths
anyhow = "1"

# .env loading
dotenvy = "0.15"

# Stream combinators (needed for subscribe_blocks stream)
futures-util = "0.3"

# Structured logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialisation (JSONL output, TOML configuration)
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
toml       = "0.8"

# CLI argument parsing (--dry-run-once flag)
clap = { version = "4", features = ["derive"] }


[profile.release]
opt-level = 3
lto       = true
